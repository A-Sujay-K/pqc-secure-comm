worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend_user {
        server frontend-user:80;
    }

    upstream frontend_supervisor {
        server frontend-supervisor:80;
    }

    server {
        listen 80;
        server_name _;

        # API routes
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket routes
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Supervisor frontend
        location /supervisor/ {
            proxy_pass http://frontend_supervisor/;
        }

        # Default: user chat app
        location / {
            proxy_pass http://frontend_user;
        }
    }
}
