[project]
name = "pqc-secure-comm-backend"
version = "1.0.0"
description = "Adaptive Hybrid Post-Quantum Secure Communication System Backend"
requires-python = ">=3.11"
dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
