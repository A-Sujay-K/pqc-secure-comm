services:
  mongodb:
    image: mongo:7.0
    container_name: pqc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: pqc_user
      MONGO_INITDB_ROOT_PASSWORD: pqc_pass
      MONGO_INITDB_DATABASE: pqc_secure_comm
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - pqc-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: pqc-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - pqc-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pqc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://pqc_user:pqc_pass@mongodb:27017/pqc_secure_comm?authSource=admin
      REDIS_URI: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pqc-network

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: pqc-frontend-user
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - pqc-network

  frontend-supervisor:
    build:
      context: ./frontend-supervisor
      dockerfile: Dockerfile
    container_name: pqc-frontend-supervisor
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - pqc-network

  nginx:
    image: nginx:1.27-alpine
    container_name: pqc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-user
      - frontend-supervisor
    networks:
      - pqc-network

volumes:
  mongodb_data:
  redis_data:

networks:
  pqc-network:
    driver: bridge
