version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: pqc_user
      MONGO_INITDB_ROOT_PASSWORD: pqc_pass
      MONGO_INITDB_DATABASE: pqc_secure_comm
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./infra/redis/redis.conf:/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  redis_data:
